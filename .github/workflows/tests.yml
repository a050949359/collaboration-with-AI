name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Static Analysis (larastan)
        run: composer analyse

      # - name: Tests
      #   run: ./vendor/bin/phpunit

      # codegraph 結構圖：在 GitHub-hosted runner 上 index（記憶體夠，VPS 不 index），
      # 產出 database/codegraph.db 以 artifact 傳給 deploy job 落到 VPS。
      # 只在 push（main）跑：db 僅 deploy job 使用，PR 時 index 是浪費。
      - name: Setup Go
        if: github.event_name == 'push'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # go.sum 分散在各 cmd/*/ 子模組，指定路徑 setup-go 才算得出快取 key
          cache-dependency-path: cmd/**/go.sum

      - name: Index codegraph
        if: github.event_name == 'push'
        run: bash scripts/codegraph-index.sh

      - name: Upload codegraph db
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: codegraph-db
          path: database/codegraph.db
          retention-days: 1

  deploy:
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy (local shell)
        run: |
          cd /var/www/collaboration-with-AI
          git pull
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm i
          npm run build

      # ci 在 GitHub-hosted 產好的結構圖 db，下載落到 VPS（VPS 不 index）。
      # db 為 gitignored，git pull 不會覆蓋；此步為最終、確保是最新快照。
      - name: Fetch codegraph db
        uses: actions/download-artifact@v7
        with:
          name: codegraph-db
          path: /var/www/collaboration-with-AI/database
